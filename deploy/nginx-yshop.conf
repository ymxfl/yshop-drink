# 由 deploy-yshop.sh 安装到应用服务器
# 访问：http://117.72.32.229/admin 、http://117.72.32.229/h5/

server {
    listen 80;
    server_name 117.72.32.229;

    client_max_body_size 32m;

    location /admin-api/ {
        proxy_pass http://127.0.0.1:48081/admin-api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    location /app-api/ {
        proxy_pass http://127.0.0.1:48081/app-api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    location /admin/ {
        alias /home/nginx2/nginx/yshop-drink/admin/;
        try_files $uri $uri/ /admin/index.html;
    }

    location = /admin {
        return 301 /admin/;
    }

    location /h5/ {
        alias /home/nginx2/nginx/yshop-drink/h5/;
        try_files $uri $uri/ /h5/index.html;
    }

    location = /h5 {
        return 301 /h5/;
    }
}
