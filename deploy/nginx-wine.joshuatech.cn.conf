# YShop - wine.joshuatech.cn（HTTPS）
# 证书目录：/home/nginx2/nginx/conf/ssl/（nginx 配置相对路径 ssl/）

server {
    listen 80;
    server_name wine.joshuatech.cn;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name wine.joshuatech.cn;

    ssl_certificate ssl/wine.joshuatech.cn_bundle.crt;
    ssl_certificate_key ssl/wine.joshuatech.cn.key;
    ssl_session_timeout 5m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:HIGH:!aNULL:!MD5:!RC4:!DHE;
    ssl_prefer_server_ciphers on;

    client_max_body_size 32m;

    location /admin-api/ {
        proxy_pass http://127.0.0.1:48081/admin-api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    location /app-api/ {
        proxy_pass http://127.0.0.1:48081/app-api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    location /admin {
        root /home/nginx2/nginx/yshop-drink;
        try_files $uri $uri/ /admin/index.html;
    }

    location /h5 {
        root /home/nginx2/nginx/yshop-drink;
        try_files $uri $uri/ /h5/index.html;
    }

    location = / {
        return 302 /admin/;
    }
}

